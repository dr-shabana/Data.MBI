<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>Redirecting…</title>
<script>
  (function(){
    var path = window.location.pathname;
    var search = window.location.search;
    var hash = window.location.hash || '';

    // Route clean URLs to their corresponding HTML files on GitHub Pages
    if (path === '/flash' || path === '/flash/' || path.startsWith('/flash?')){
      window.location.replace(window.location.origin + '/flash.html' + search + hash);
      return;
    }
    if (path === '/flashmake' || path === '/flashmake/' || path.startsWith('/flashmake?')){
      window.location.replace(window.location.origin + '/flashmake.html' + search + hash);
      return;
    }

    // Capture date routes (e.g. /11-9-2026) and bounce to index.html
    var full = path + search + hash;
    sessionStorage.setItem('mb_redirect_path', full);
    window.location.replace(window.location.origin + '/index.html');
  })();
</script>
</head>
<body>
  Redirecting to MedicineBank…
</body>
</html>
